<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending Searches — Perplexity 3</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .trending-list {
            margin-top: 40px;
            max-width: 800px;
        }
        .trending-row {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            margin-bottom: 12px;
            backdrop-filter: var(--glass-blur);
            transition: all 0.3s;
            cursor: pointer;
        }
        .trending-row:hover {
            transform: translateX(10px);
            border-color: var(--accent-color);
            background: var(--glass-border);
        }
        .rank {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-color);
            min-width: 40px;
        }
        .query-info {
            flex: 1;
        }
        .query-text {
            font-weight: 600;
            font-size: 18px;
            color: var(--text-primary);
        }
        .query-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .score-badge {
            background: var(--btn-gradient);
            color: white;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }
    </style>
</head>
<body class="dark-mode">
    <div class="app-container">
        <main class="main-content" style="padding: 40px 60px; overflow-y: auto;">
            <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Search</a>
            <h1 class="greeting" style="font-size: 48px; text-align: left;">What's Trending</h1>
            <p class="sub-greeting" style="margin: 0; text-align: left;">The most active searches from the community in the last 24 hours.</p>
            
            <div id="trending-container" class="trending-list">
                <div class="loading">Fetching current trends...</div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/trending')
                .then(r => r.json())
                .then(data => {
                    var container = document.getElementById('trending-container');
                    container.innerHTML = '';
                    
                    if (data.length === 0) {
                        container.innerHTML = '<p>No trending searches at the moment. Be the first!</p>';
                        return;
                    }

                    data.forEach((item, index) => {
                        var row = document.createElement('div');
                        row.className = 'trending-row';
                        row.onclick = function() {
                            window.location.href = '/?q=' + encodeURIComponent(item.query);
                        };
                        row.innerHTML = `
                            <div class="rank">#${index + 1}</div>
                            <div class="query-info">
                                <div class="query-text">${item.query}</div>
                                <div class="query-meta">${item.count} searches • Quality Score: ${item.score}</div>
                            </div>
                            <div class="score-badge"><i class="fa-solid fa-bolt"></i> Trending</div>
                        `;
                        container.appendChild(row);
                    });
                });
        });
    </script>
</body>
</html>
